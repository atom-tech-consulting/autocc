[project]
name = "autocc"
version = "0.1.0"
description = "Skills + hooks that let a Claude Code session run unattended on a TASKS.md task board."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "autocc contributors", email = "autocc@atomtechconsulting.com" }]
keywords = ["claude", "claude-code", "automation", "autopilot", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
autocc = "autocc.cli:main"

[project.urls]
Homepage = "https://github.com/atom-tech-consulting/autocc"
Issues = "https://github.com/atom-tech-consulting/autocc/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocc"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "autocc/_skills"

[tool.hatch.build.targets.sdist]
include = [
    "src/autocc",
    "skills",
    "README.md",
    "ARCHITECTURE.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
